name: Tests

on:
  push:
  workflow_dispatch:
  # The suites against real accounts (google, microsoft, fastmail) run weekly
  # and by hand, never on push: a push storm burns their quotas.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit

  live-tests:
    # Only in this repository, weekly or by hand: a fork holds no secret, and
    # the job would fail there for want of one.
    if: github.repository == 'pimalaya/carillon' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Start the local Stalwart
        run: ./tests/stalwart.sh
      - name: Run the live tests
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MSGRAPH_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MSGRAPH_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MSGRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          FASTMAIL_API_TOKEN: ${{ secrets.FASTMAIL_API_TOKEN }}
        run: nix develop -c cargo test --test google --test msgraph --test jmap -- --ignored --test-threads 1

  features:
    # Each backend and each TLS provider builds alone, so clippy runs over
    # every feature set a packager may pick, one cache for all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy over every feature set
        run: |
          set -e
          sets=(
            ""
            "--all-features"
            "--no-default-features --features rustls-ring"
            "--no-default-features --features imap,rustls-ring"
            "--no-default-features --features jmap,native-tls"
            "--no-default-features --features maildir"
            "--no-default-features --features caldav,rustls-aws"
          )
          for backend in imap jmap maildir caldav carddav msgraph gmail gcal gpeople pimdir; do
            sets+=("--no-default-features --features rustls-ring,$backend")
          done
          for set in "${sets[@]}"; do
            echo "::group::clippy $set"
            read -ra flags <<< "$set"
            nix develop -c cargo clippy --locked --all-targets "${flags[@]}" -- -D warnings
            echo "::endgroup::"
          done
      # Without imap, a configuration declaring it meets a backend left out.
      - name: Test a build without the imap backend
        run: nix develop -c cargo test --locked --no-default-features --features rustls-ring,maildir
