# ================================================================================
# `carillon` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/carillon/config.toml
#   - $HOME/.config/carillon/config.toml
#   - $HOME/.carillonrc
#
# Override with `carillon -c <PATH>` or `CARILLON_CONFIG=<PATH>`, both accepting a
# `:`-delimited list: the first one is the base and the rest are deep-merged on
# top of it.
#
# There is no wizard: copy this file, keep one backend and the hooks you want,
# then delete the rest. The `[accounts.<name>]` block is the schema `himalaya`
# CLI v2 and `himalaya-tui` read, so one file backs all three binaries; the
# carillon-only fields (`collection`, and the `watch` and `hook` tables under
# each backend) are ignored by them.
# ================================================================================

[accounts.example]

# Use this account when `-a/--account` is not passed.
default = true

# What this account watches, and the only thing it watches: one account is one
# backend is one collection. Required. Watching a second collection is a second
# account, which is also how it gets its own hooks. `mailbox` still reads as the
# former name of this key.
#
# IMAP takes the mailbox name. JMAP matches it by name, case-insensitively,
# falling back to the special-use role for "INBOX". Maildir resolves it under
# the backend root, "." naming the root itself. CalDAV, CardDAV and WebDAV read
# it as a path under their `server`, or as an absolute path when it starts with
# a slash.
collection = "INBOX"


# --------------------------------------------------------------------------------
# Backend config
# --------------------------------------------------------------------------------

# Declare one or more of the `imap`, `jmap`, `maildir`, `caldav`, `carddav` and
# `dav` blocks below. With more than one, `-b/--backend` selects the active one;
# `-b auto`, the default, takes the first configured in that order.
#
# Each block carries the hooks that backend fires, under `<backend>.hook`
# (`hooks` also reads). A hook is named after what its backend holds, so mail
# fires `on-message-*`, an addressbook `on-card-*`, a calendar `on-event-*` and
# `on-task-*`, and an untyped collection `on-item-*`. A backend takes only its
# own names, and only the events its protocol can express, so anything else is
# refused when this file is read rather than staying quiet forever.
#
# Every hook fires a `notify` desktop notification, a `cmd`, or both. `cmd` is
# either a string handed to the platform shell (/bin/sh -c on Unix, cmd /C on
# Windows) or a [program, args...] list spawned directly. Either way the
# placeholders reach it as environment variables.
#
# Always available: $id and $collection. $id is the backend's own id: an IMAP
# UID, a JMAP Email id, a Maildir file name, a WebDAV href. The envelope
# variables ($subject, $date, $sender, $sender_name, $sender_address,
# $recipient, $recipient_name, $recipient_address) are resolved on a second
# connection, over IMAP only, and only for on-message-added. A flag hook gets
# $flag instead, naming the one flag that moved.
#
# Every secret below is either `raw = "..."` or `command = "..."`, the command
# being a string handed to the platform shell or a [program, args...] list, and
# its standard output the value.
# ---- IMAP: an idle connection (RFC 2177) ---------------------------------------

# Server address: a bare authority (`imap.example.org[:port]`, read as
# `imaps://<authority>`), or a full `imap://` (cleartext, optionally upgraded
# with STARTTLS) or `imaps://` (implicit TLS) URL used verbatim.
imap.server = "imaps://imap.example.org"

# Upgrade a cleartext connection with STARTTLS.
#imap.starttls = false

# TLS options, defaulting to the first provider available at runtime.
#imap.tls.provider = "rustls"     # or "native-tls"
#imap.tls.rustls.crypto = "ring"  # or "aws"
#imap.tls.cert = "/path/to/custom/cert.pem"

# Exactly one SASL mechanism among `plain`, `login`, `anonymous`,
# `oauthbearer`, `xoauth2` and `scram-sha-256`. Omit the whole `imap.sasl`
# table to skip authentication entirely, sending no `AUTHENTICATE` command.
imap.sasl.plain.username = "user@example.org"
imap.sasl.plain.password.raw = "REPLACE_ME"
#imap.sasl.plain.password.command = "pass show carillon/example"
#imap.sasl.plain.authzid = "user@example.org"
#imap.sasl.login.username = "user@example.org"
#imap.sasl.login.password.raw = "REPLACE_ME"
#imap.sasl.anonymous.message = "carillon"
#imap.sasl.oauthbearer.username = "user@example.org"
#imap.sasl.oauthbearer.token.command = ["ortie", "token", "read", "example"]
#imap.sasl.xoauth2.username = "user@example.org"
#imap.sasl.xoauth2.token.command = "ortie token read gmail"
#imap.sasl.scram-sha-256.username = "user@example.org"
#imap.sasl.scram-sha-256.password.raw = "REPLACE_ME"

# Force the RFC 4959 SASL-IR initial response on or off. Unset follows the
# advertised capability, which Coremail (126.com, 163.com) advertises and then
# rejects: set it to false there.
#imap.sasl-ir = false

# RFC 2971 ID exchange, which some providers (mail.qq.com, fastmail) require
# straight after authentication. Only the listed fields are sent: `true` sends
# carillon's canned value for `name`, `version`, `vendor` and `support-url`,
# `false` sends NIL, and an empty map sends `ID NIL`.
#imap.id.auto = false
#imap.id.fields = { name = true, version = true, vendor = true, support-url = true }

# How this account learns about a change, IMAP offering two ways. Unset holds
# the idle connection, re-issuing it every 29 seconds, which is short enough to
# survive a NAT box that drops a quiet connection. A server known to hold one
# open is asked less often, up to the 29 minutes RFC 2177 allows. Both values
# are in seconds.
#imap.watch.idle.timeout = 600
#imap.watch.poll.interval = 60


# Mail is immutable, so IMAP reports arrivals, departures and flags, never an
# edit. A flag hook fires once for each flag that moved, so `$flag` always names
# the flag it fired for; `flags = [...]` narrows it to the flags it lists, with
# or without the leading `\` or `$` and whatever the case.
imap.hook.on-message-added.notify.summary = "New mail from $sender"
imap.hook.on-message-added.notify.body = "$subject"
imap.hook.on-message-added.cmd = 'echo "$id arrived" >> ~/.local/state/carillon.log'
#imap.hook.on-message-removed.cmd = 'echo "$id left" >> ~/.local/state/carillon.log'
imap.hook.on-flag-added.flags = ["Seen"]
imap.hook.on-flag-added.cmd = ["notify-send", "$flag set on $id"]
#imap.hook.on-flag-removed.notify.summary = "$flag cleared on $id"
# ---- JMAP: a changes poll (RFC 8621) -------------------------------------------

# Server address: a bare authority, discovered through `/.well-known/jmap`, or
# a full URL naming the session endpoint.
#jmap.server = "fastmail.com"
#jmap.server = "https://api.fastmail.com/jmap/session"

# TLS options, same shape as `imap.tls`.
#jmap.tls.provider = "rustls"

# Exactly one of `header`, whose value is sent verbatim, `bearer` or `basic`.
#jmap.auth.header.command = "pass show carillon/fastmail-token"
#jmap.auth.bearer.token.command = ["ortie", "token", "read", "fastmail"]
#jmap.auth.basic.username = "user@example.org"
#jmap.auth.basic.password.command = "pass show carillon/example"

# How this account learns about a change, JMAP offering two ways. Unset holds
# the event stream, whose ping is the server keep-alive that also proves the
# stream is still there.
#jmap.watch.push.ping = 30
#jmap.watch.poll.interval = 60


# Same events as IMAP, JMAP keywords arriving under the same flag names.
#jmap.hook.on-message-added.notify.summary = "New mail from $sender"
#jmap.hook.on-message-removed.cmd = "true"
#jmap.hook.on-flag-added.flags = ["Seen"]
#jmap.hook.on-flag-removed.cmd = "true"
# ---- Maildir: a listing poll ---------------------------------------------------

# Root of the Maildir tree, subfolders being real nested directories, the
# layout himalaya uses. Watch the root itself with collection = "." or "INBOX",
# and a subfolder by its path, e.g. collection = "Archive".
#maildir.root = "~/Mail/example"

# Maildir has one way: re-list on an interval, a couple of seconds when unset.
#maildir.watch.poll.interval = 2


# Same events again, the Maildir flag letters arriving under the same names.
#maildir.hook.on-message-added.notify.summary = "$id arrived"
#maildir.hook.on-message-removed.cmd = "true"
#maildir.hook.on-flag-added.flags = ["Seen"]
#maildir.hook.on-flag-removed.cmd = "true"

# ---- CalDAV: a sync-collection poll over a calendar (RFC 6578) ------------------

# The DAV server URL. What to watch under it is the account's `collection`,
# read as a path: `collection = "calendars/alice/work/"` here.
#caldav.server = "https://dav.example.org/"

# Omit for a calendar readable without authentication.
#caldav.auth.basic.username = "alice"
#caldav.auth.basic.password.command = "pass show dav/example"
#caldav.auth.bearer.token.command = "ortie token read example"

# TLS options, same shape as `imap.tls`.
#caldav.tls.provider = "rustls"

# WebDAV has one way: ask sync-collection on an interval, a minute when unset.
#caldav.watch.poll.interval = 60

# A calendar holds events, tasks, or both, and the watch asks it which when it
# starts: a calendar holding only one of them answers for all its members at
# once, and hooks naming a component it does not hold are refused there. A
# calendar holding both costs one property read per member the watch has not
# seen, which reads its content type and never the event itself.
#caldav.hook.on-event-added.notify.summary = "New event"
#caldav.hook.on-event-changed.cmd = "true"
#caldav.hook.on-event-removed.cmd = "true"
#caldav.hook.on-task-added.notify.summary = "New task"
#caldav.hook.on-task-changed.cmd = "true"
#caldav.hook.on-task-removed.cmd = "true"

# ---- CardDAV: the same poll over an addressbook --------------------------------

#carddav.server = "https://dav.example.org/"
#carddav.auth.basic.username = "alice"
#carddav.auth.basic.password.command = "pass show dav/example"
#carddav.watch.poll.interval = 60

# A vCard is edited where it stands, which is what `on-card-changed` reports and
# no mail backend has: its etag moved, and the poll never reads the card itself.
#carddav.hook.on-card-added.notify.summary = "New contact"
#carddav.hook.on-card-changed.cmd = "true"
#carddav.hook.on-card-removed.cmd = "true"

# ---- WebDAV: the same poll over a collection naming no domain ------------------

# For a collection that is neither a calendar nor an addressbook, whose members
# are items because nothing better can be said about them.
#dav.server = "https://dav.example.org/"
#dav.auth.basic.username = "alice"
#dav.auth.basic.password.command = "pass show dav/example"
#dav.watch.poll.interval = 60
#dav.hook.on-item-added.notify.summary = "$id arrived"
#dav.hook.on-item-changed.cmd = "true"
#dav.hook.on-item-removed.cmd = "true"
