# ================================================================================
# `mirador` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/mirador/config.toml
#   - $HOME/.config/mirador/config.toml
#   - $HOME/.miradorrc
#
# Override with `mirador -c <PATH>` or `MIRADOR_CONFIG=<PATH>`. Multiple paths
# can be passed at once, separated by `:`; the first one is the base and the
# rest are deep-merged on top of it.
#
# Run `mirador watch` once with no config file on disk to bootstrap this
# template at the first path, then edit the resulting file (set up at least
# one backend and a hook) and re-run `mirador watch`.
#
# The `[accounts.<name>]` block uses the same schema as `himalaya` CLI v2 and
# `himalaya-tui`. One TOML file can back all three binaries; mirador-only
# fields (`mailbox`, the four `on-*` hook tables) coexist with the shared keys
# without errors.
# ================================================================================

# --------------------------------------------------------------------------------
# Account config
# --------------------------------------------------------------------------------

# Declare one section per account. Pick one with `-a/--account <NAME>` or let
# mirador use the entry flagged `default = true`.
[accounts.example]

# Use this account when `-a/--account` is not passed.
default = true

# Mailbox watched by `mirador watch` when `-m/--mailbox` is omitted. Defaults
# to `"INBOX"` for IMAP/JMAP and to the mailbox name for Maildir. For JMAP,
# set this to the Mailbox **id** (not the display name); look it up once via
# `himalaya jmap mailbox query` or the provider's admin console. For Maildir,
# the value resolves relative to the backend `root` (use `"."` for the root
# mailbox).
mailbox = "INBOX"

# --------------------------------------------------------------------------------
# Backend config
#
# Declare one or more of the `imap`, `jmap`, `maildir` blocks below. When more
# than one is configured, `-b/--backend {imap,jmap,maildir}` selects the active
# one; with `-b auto` (default) the priority order is IMAP, then JMAP, then
# Maildir, and the first configured block wins.
# --------------------------------------------------------------------------------

# ---- IMAP backend (RFC 2177 IDLE) ----------------------------------------------

# IMAP server address. Either a bare authority (`imap.example.org[:port]`,
# treated as `imaps://<authority>` by default), or a full URL with `imap://`
# (cleartext, optionally upgraded via STARTTLS) or `imaps://` (implicit TLS)
# scheme used verbatim.
imap.server = "imaps://imap.example.org"
#imap.server = "imap.example.org"
#imap.server = "imap://example.org:143"

# Enable STARTTLS (only valid when the server resolves to `imap://`).
#imap.starttls = false

# Force the RFC 4959 SASL-IR initial response on or off. Unset follows the
# advertised SASL-IR capability, which Coremail (126.com, 163.com) advertises
# and then rejects; set it to false there.
#imap.sasl-ir = false

# TLS provider, defaults to the first available at runtime.
#imap.tls.provider = "rustls"
#imap.tls.provider = "native-tls"
#imap.tls.rustls.crypto = "ring"
#imap.tls.rustls.crypto = "aws"
#imap.tls.cert = "/path/to/custom/cert.pem"

# Pick exactly one SASL mechanism among `anonymous`, `login`, `plain`,
# `oauthbearer`, `xoauth2`, `scram-sha-256`. Omit the whole `imap.sasl` table
# to skip authentication entirely (no `AUTHENTICATE` command sent).

# SASL PLAIN (https://www.iana.org/go/rfc4616)
imap.sasl.plain.username = "user@example.org"
imap.sasl.plain.password.raw = "REPLACE_ME"
#imap.sasl.plain.authzid = "user@example.org"  # optional authorization identity
#imap.sasl.plain.password.command = "pass show mirador/example"

# SASL LOGIN (https://datatracker.ietf.org/doc/html/draft-murchison-sasl-login-00)
#imap.sasl.login.username = "user@example.org"
#imap.sasl.login.password.raw = "***"

# SASL ANONYMOUS (https://www.iana.org/go/rfc4505)
#imap.sasl.anonymous.message = "mirador"

# SASL OAUTHBEARER (https://www.iana.org/go/rfc7628). Host/port for the
# GS2 header are derived from the IMAP server URL at connect time.
#imap.sasl.oauthbearer.username = "user@example.org"
#imap.sasl.oauthbearer.token.command = ["ortie", "token", "read", "example"]

# SASL XOAUTH2 (Google's pre-standard OAuth 2.0 SASL).
#imap.sasl.xoauth2.username = "user@example.org"
#imap.sasl.xoauth2.token.command = "ortie token read gmail"

# SASL SCRAM-SHA-256 (https://www.iana.org/go/rfc7677)
#imap.sasl.scram-sha-256.username = "user@example.org"
#imap.sasl.scram-sha-256.password.raw = "***"

# RFC 2971 ID extension. Some providers (mail.qq.com, fastmail) require an `ID`
# exchange straight after authentication; set `auto = true` to opt in.
# https://www.rfc-editor.org/rfc/rfc2971.html
#imap.id.auto = false

# Per-field policy for the auto-ID command. Keys not listed here are NOT sent.
# `true` substitutes mirador's canned value for the well-known keys (name,
# version, vendor, support-url); unknown keys with `true` fall back to NIL with
# a warning. `false` always sends NIL. An empty map sends `ID NIL`.
#imap.id.fields = { name = true, version = true, vendor = true, support-url = true }

# ---- JMAP backend (RFC 8620 §7.2 EventSource push) -----------------------------

# JMAP server address. Either a bare authority (auto-discovered via
# `GET /.well-known/jmap`) or a full URL pointing directly at the session
# endpoint.
#jmap.server = "fastmail.com"
#jmap.server = "https://api.fastmail.com/jmap/session"

# TLS knobs mirror the imap.tls block above.
#jmap.tls.provider = "rustls"
#jmap.tls.rustls.crypto = "ring"
#jmap.tls.cert = "/path/to/custom/cert.pem"

# Pick exactly one of `header`, `bearer`, `basic`.

# Raw `Authorization` header value, used verbatim.
#jmap.auth.header.raw = "Bearer eyJhbGciOiJ..."
#jmap.auth.header.command = "pass show mirador/fastmail-token"

# OAuth 2.0 / API token bearer.
#jmap.auth.bearer.token.command = ["ortie", "token", "read", "fastmail"]

# HTTP Basic.
#jmap.auth.basic.username = "user@example.org"
#jmap.auth.basic.password.command = "pass show mirador/example"

# ---- Maildir backend (listing poll) -------------------------------------------

# Root directory containing one subdirectory per mailbox (Maildir++ layout).
#maildir.root = "~/Mail/example"

# --------------------------------------------------------------------------------
# Hooks: hooks.on-{message,flags}-{added,removed}.{notify,cmd}. `cmd` is
# either a string (handed to /bin/sh -c on Unix, cmd /C on Windows) or a
# list [program, args...] spawned directly. Placeholders are exported as
# environment variables on the spawned process: $id, $mailbox, $subject,
# $date, $sender, $sender_name, $sender_address, $recipient, $recipient_name,
# $recipient_address, $flag, $flags.
#
# $id is the backend's own message id: an IMAP UID, a JMAP Email id, a Maildir
# file name. The envelope variables ($subject, $date, $sender, $recipient) are
# resolved on a second connection and only for on-message-added, over IMAP; the
# other backends leave them unset.
#
# Flag names are normalised across backends, so one filter fires everywhere:
# IMAP \Seen, JMAP $seen and the Maildir S letter all arrive as Seen.
# --------------------------------------------------------------------------------

hooks.on-message-added.notify.summary = "New mail from $sender"
hooks.on-message-added.notify.body = "$subject"
hooks.on-message-added.cmd = 'echo "$id arrived" >> ~/.local/state/mirador.log'

hooks.on-flags-added.flags = ["Seen"]
hooks.on-flags-added.cmd = ["notify-send", "New flag on $id"]
