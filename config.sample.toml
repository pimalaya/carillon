# ================================================================================
# `carillon` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/carillon/config.toml
#   - $HOME/.config/carillon/config.toml
#   - $HOME/.carillonrc
#
# Override with `carillon -c <PATH>` or `CARILLON_CONFIG=<PATH>`, both taking a
# `:`-delimited list: the first one is the base and the rest are deep-merged on
# top of it.
#
# `carillon configure` generates an account from your email address, testing the
# connection before writing it here. Everything it does not cover is written by
# hand, which is what this file documents: copy it, keep one backend and the
# hooks you want, then delete the rest.
# ================================================================================

[accounts.example]

# Use this account when `-a/--account` is not passed.
default = true

# Proxy the network backends of this account connect through, absent their own
# `<backend>.proxy` block (same keys). Without any, the `all_proxy` and
# `https_proxy` environment variables are read. The URL takes `socks5://`,
# `socks5h://` or `http://`.
#proxy.url = "socks5h://localhost:1080"
#proxy.username = "alice"
#proxy.password.command = "pass show proxy"


# --------------------------------------------------------------------------------
# Backend config
# --------------------------------------------------------------------------------

# Declare one or more of the `imap`, `jmap`, `maildir`, `caldav`, `carddav`,
# `msgraph`, `gmail`, `gcal` and `gpeople` blocks below. With more than one,
# `-b/--backend` selects the active one; `-b auto`, the default, takes the first
# configured in that order.
#
# Each block carries the one collection it watches, required and named after its
# own domain: `imap.mailbox`, `maildir.mailbox`, `gmail.mailbox`,
# `caldav.calendar`, `gcal.calendar`, `carddav.addressbook`,
# `gpeople.addressbook`. JMAP and Microsoft Graph take one per domain, at least
# one of `<backend>.mailbox`, `<backend>.addressbook` and `<backend>.calendar`,
# sharing one connection.
# Watching a second collection of a domain is a second account, which is also how
# it gets its own hooks.
#
# Each block also carries the hooks that backend fires, under `<backend>.hook`
# (`hooks` also reads), named after what it holds: `on-message-*` for mail,
# `on-card-*` for an addressbook, `on-event-*` and `on-task-*` for a calendar.
# Anything else is refused when this file is read rather than staying quiet.
#
# Every hook fires a `notify` desktop notification, a `cmd`, or both. `cmd` is
# either a string handed to the platform shell (/bin/sh -c on Unix, cmd /C on
# Windows) or a [program, args...] list spawned directly, the placeholders
# reaching it as environment variables either way.
#
# A hook templates against $id, which is the backend's own id (an IMAP UID, a
# JMAP object id, a Maildir file name, a WebDAV href), and against the collection
# under the name its backend configures it: $mailbox, $calendar, $addressbook. A
# flag hook adds $flag, naming the one flag that moved.
#
# The envelope variables ($subject, $date, $sender, $sender_name,
# $sender_address, $recipient, $recipient_name, $recipient_address) belong to the
# on-message-added hook of IMAP and JMAP alone, the two that read one. A
# notification naming anything else is refused when this file is read.
#
# Write `${name:default}` where a hook can do without the value: a variable the
# hook may use but this one item lacks (a message with no sender, an arrival
# whose resolution failed) expands to nothing.
#
# Every secret below is either `raw = "..."` or `command = "..."`, the command
# being a string handed to the platform shell or a [program, args...] list, and
# its standard output the value.

# ---- IMAP: an idle connection (RFC 2177) ---------------------------------------

# The mailbox this account watches. Required.
imap.mailbox = "INBOX"

# Server address: a bare authority (`imap.example.org[:port]`) is read as
# `imaps://<authority>`; an `imap://` (cleartext, optionally upgraded with
# STARTTLS) or `imaps://` (implicit TLS) URL is used verbatim.
imap.server = "imaps://imap.example.org"

# Upgrade a cleartext connection with STARTTLS.
#imap.starttls = false

# TLS options, defaulting to the first provider available at runtime.
#imap.tls.provider = "rustls"     # or "native-tls"
#imap.tls.rustls.crypto = "ring"  # or "aws"
#imap.tls.cert = "~/certs/example.pem"  # tilde and $VAR are expanded

# ALPN identifiers offered during the TLS handshake, unset taking io-imap's own
# `["imap"]`. An empty list skips ALPN, a non-empty one replaces the default,
# and only rustls reads it, native-tls having no ALPN.
#imap.alpn = ["imap"]

# Proxy overriding the account one, same shape as `proxy`.
#imap.proxy.url = "http://proxy.example.org:3128"

# Exactly one SASL mechanism among `plain`, `login`, `anonymous`, `oauthbearer`,
# `xoauth2` and `scram-sha-256`. Omit the whole `imap.sasl` table to skip
# authentication, sending no `AUTHENTICATE` command at all.
imap.sasl.plain.username = "user@example.org"
imap.sasl.plain.password.raw = "REPLACE_ME"
#imap.sasl.plain.password.command = "pass show carillon/example"
#imap.sasl.plain.authzid = "user@example.org"
#imap.sasl.login.username = "user@example.org"
#imap.sasl.login.password.raw = "REPLACE_ME"
#imap.sasl.anonymous.message = "carillon"
#imap.sasl.oauthbearer.username = "user@example.org"
#imap.sasl.oauthbearer.token.command = ["ortie", "token", "read", "example"]
#imap.sasl.xoauth2.username = "user@example.org"
#imap.sasl.xoauth2.token.command = "ortie token read gmail"
#imap.sasl.scram-sha-256.username = "user@example.org"
#imap.sasl.scram-sha-256.password.raw = "REPLACE_ME"

# Force the RFC 4959 SASL-IR initial response on or off. Unset follows the
# advertised capability, which Coremail (126.com, 163.com) advertises and then
# rejects: set it to false there.
#imap.sasl-ir = false

# RFC 2971 ID exchange, which some providers (mail.qq.com, fastmail) require
# straight after authentication. Only the listed fields are sent: `true` sends
# carillon's canned value for `name`, `version`, `vendor` and `support-url`,
# `false` sends NIL, and an empty map sends `ID NIL`.
#imap.id.auto = false
#imap.id.fields = { name = true, version = true, vendor = true, support-url = true }

# How this account learns about a change, IMAP offering two ways. Unset holds
# the idle connection, re-issued every 29 seconds, short enough to survive a NAT
# box dropping a quiet connection; a server known to hold one open is asked less
# often, up to the 29 minutes RFC 2177 allows. Both values are in seconds.
#imap.watch.idle.timeout = 600
#imap.watch.poll.interval = 60


# Mail is immutable, so IMAP reports arrivals, departures and flags, never an
# edit. A flag hook fires once per flag that moved, so `$flag` always names the
# one it fired for; `flags = [...]` narrows it, matching with or without the
# leading `\` or `$` and whatever the case.
imap.hook.on-message-added.notify.summary = "New mail in $mailbox from $sender"
imap.hook.on-message-added.notify.body = "$subject"
imap.hook.on-message-added.cmd = 'echo "$id arrived" >> ~/.local/state/carillon.log'
#imap.hook.on-message-removed.notify.summary = "Mail ${subject:with no subject} deleted"
#imap.hook.on-message-removed.cmd = 'echo "$id left" >> ~/.local/state/carillon.log'
imap.hook.on-flag-added.flags = ["Seen"]
imap.hook.on-flag-added.cmd = ["notify-send", "$flag set on $id"]
#imap.hook.on-flag-removed.notify.summary = "$flag cleared on $id"


# ---- JMAP: a changes poll (RFC 8621, RFC 9610, JMAP for Calendars) -------------

# The collections this account watches, at least one. The mailbox is matched by
# name case-insensitively, falling back to the special-use role for "INBOX"; the
# addressbook and the calendar by name case-insensitively or by id. All of them
# share the session, the connection and the event stream.
#jmap.mailbox = "INBOX"
#jmap.addressbook = "Personal"
#jmap.calendar = "Calendar"

# Server address: a bare authority, discovered through `/.well-known/jmap`, or
# a full URL naming the session endpoint.
#jmap.server = "fastmail.com"
#jmap.server = "https://api.fastmail.com/jmap/session"

# TLS options, same shape as `imap.tls`.
#jmap.tls.provider = "rustls"

# ALPN, read as `imap.alpn`, unset taking io-jmap's own `["http/1.1"]`.
#jmap.alpn = ["http/1.1"]

# Proxy, read as `imap.proxy`.
#jmap.proxy.url = "http://proxy.example.org:3128"

# Exactly one of `header`, whose value is sent verbatim, `bearer` or `basic`.
#jmap.auth.header.command = "pass show carillon/fastmail-token"
#jmap.auth.bearer.token.command = ["ortie", "token", "read", "fastmail"]
#jmap.auth.basic.username = "user@example.org"
#jmap.auth.basic.password.command = "pass show carillon/example"

# How this account learns about a change, JMAP offering two ways. Unset holds
# the event stream, whose ping is the server keep-alive that also proves the
# stream is still there.
#jmap.watch.push.ping = 30
#jmap.watch.poll.interval = 60


# Same events as IMAP, JMAP keywords arriving under the same flag names. The
# envelope comes from the request the poll already makes, so an arrival hook
# names $subject and $sender at no extra cost.
#jmap.hook.on-message-added.notify.summary = "New mail in $mailbox from $sender"
#jmap.hook.on-message-added.notify.body = "$subject"
#jmap.hook.on-message-removed.cmd = "true"
#jmap.hook.on-flag-added.flags = ["Seen"]
#jmap.hook.on-flag-removed.cmd = "true"

# Contacts and calendar events are edited where they stand, which is what
# `on-card-changed` and `on-event-changed` report. A hook for a domain whose
# collection is not configured is refused. There is no `on-task-*`, JMAP
# calendars having no task type.
#jmap.hook.on-card-added.notify.summary = "New contact in $addressbook"
#jmap.hook.on-card-changed.cmd = "true"
#jmap.hook.on-event-changed.notify.summary = "Event $id changed in $calendar"


# ---- Maildir: a listing poll ---------------------------------------------------

# The mailbox this account watches, resolved under `root` through io-maildir's
# store; "." and "INBOX" both name the root itself. Required.
#maildir.mailbox = "."

# Root of the Maildir tree, subfolders being real nested directories, the usual
# layout. `maildir.mailbox` watches the root itself with "." or "INBOX", and a
# subfolder by its path, "Archive" for instance.
#maildir.root = "~/Mail/example"

# Maildir has one way: re-list on an interval, a couple of seconds when unset.
#maildir.watch.poll.interval = 2


# Same events again, the Maildir flag letters arriving under the same names.
#maildir.hook.on-message-added.notify.summary = "$id arrived"
#maildir.hook.on-message-removed.cmd = "true"
#maildir.hook.on-flag-added.flags = ["Seen"]
#maildir.hook.on-flag-removed.cmd = "true"


# ---- CalDAV: a sync-collection poll over a calendar (RFC 6578) ------------------

# The calendar this account watches, read as a path under `caldav.server`, or as
# an absolute path when it starts with a slash. Required.
#caldav.calendar = "calendars/alice/work/"

# The DAV server URL, naming the root the calendar hangs under.
#caldav.server = "https://dav.example.org/"

# Omit for a calendar readable without authentication.
#caldav.auth.basic.username = "alice"
#caldav.auth.basic.password.command = "pass show dav/example"
#caldav.auth.bearer.token.command = "ortie token read example"

# TLS options, same shape as `imap.tls`.
#caldav.tls.provider = "rustls"

# ALPN, read as `imap.alpn`, unset taking io-http's own `["http/1.1"]`.
#caldav.alpn = ["http/1.1"]

# Proxy, read as `imap.proxy`.
#caldav.proxy.url = "http://proxy.example.org:3128"

# WebDAV has one way: ask sync-collection on an interval, a minute when unset.
#caldav.watch.poll.interval = 60

# A calendar holds events, tasks or both, and the watch asks it which when it
# starts: hooks naming a component it does not hold are refused there. Holding
# both costs one property read per member the watch has not seen, which reads
# its content type and never the event itself.
#caldav.hook.on-event-added.notify.summary = "New event"
#caldav.hook.on-event-changed.cmd = "true"
#caldav.hook.on-event-removed.cmd = "true"
#caldav.hook.on-task-added.notify.summary = "New task"
#caldav.hook.on-task-changed.cmd = "true"
#caldav.hook.on-task-removed.cmd = "true"


# ---- CardDAV: the same poll over an addressbook --------------------------------

# The addressbook this account watches, read the same way. Required.
#carddav.addressbook = "addressbooks/alice/default/"

#carddav.server = "https://dav.example.org/"
#carddav.alpn = ["http/1.1"]
#carddav.proxy.url = "http://proxy.example.org:3128"
#carddav.auth.basic.username = "alice"
#carddav.auth.basic.password.command = "pass show dav/example"
#carddav.watch.poll.interval = 60

# A vCard is edited where it stands, which is what `on-card-changed` reports and
# no mail backend has: its etag moved, the poll never reading the card itself.
#carddav.hook.on-card-added.notify.summary = "New contact"
#carddav.hook.on-card-changed.cmd = "true"
#carddav.hook.on-card-removed.cmd = "true"



# ---- Microsoft Graph: delta queries and a calendar listing poll ----------------

# The collections this account watches, at least one, sharing one token and one
# connection: a mail folder by display name, id or well-known name (`inbox`), a
# contact folder (`Contacts` being the default one) and a calendar, both by name
# or id.
#msgraph.mailbox = "inbox"
#msgraph.addressbook = "Contacts"
#msgraph.calendar = "Calendar"

# The mailbox owner, unset meaning the token's own user.
#msgraph.user-id = "alice@example.org"

# Microsoft Graph, Gmail, Google Calendar and Google People take an OAuth 2.0
# bearer token alone, which expires: read it from a broker such as Ortie.
#msgraph.auth.token.command = ["ortie", "token", "read", "microsoft"]

# TLS, ALPN and proxy, read as under `imap`.
#msgraph.alpn = ["http/1.1"]
#msgraph.proxy.url = "http://proxy.example.org:3128"

# These APIs push only to a public endpoint, so they poll, a minute when unset.
#msgraph.watch.poll.interval = 60

# Same events as JMAP: `isRead` arrives as `Seen`, a follow-up flag as `Flagged`.
# The calendar is listed on every poll and its `changeKey` compared, an event
# being edited where it stands whatever its date.
#msgraph.hook.on-message-added.notify.summary = "New mail in $mailbox from $sender"
#msgraph.hook.on-message-added.notify.body = "$subject"
#msgraph.hook.on-flag-added.flags = ["Flagged"]
#msgraph.hook.on-card-changed.cmd = "true"
#msgraph.hook.on-event-changed.notify.summary = "Event $id changed in $calendar"


# ---- Gmail: a history poll -----------------------------------------------------

# The label this account watches, by name or id. Required.
#gmail.mailbox = "INBOX"

#gmail.auth.token.command = ["ortie", "token", "read", "google"]
#gmail.watch.poll.interval = 60

# Same events as IMAP: a cleared `UNREAD` arrives as `Seen`, `STARRED` as
# `Flagged`. The envelope is read from the arrival's headers.
#gmail.hook.on-message-added.notify.summary = "New mail in $mailbox from $sender"
#gmail.hook.on-message-added.notify.body = "$subject"
#gmail.hook.on-flag-added.flags = ["Seen"]


# ---- Google Calendar: a sync token poll ----------------------------------------

# The calendar this account watches, by name or id, `primary` being the
# account's own. Required.
#gcal.calendar = "primary"

#gcal.auth.token.command = ["ortie", "token", "read", "google"]
#gcal.watch.poll.interval = 60

# Events alone, the API having no task type. A recurring series is one event.
#gcal.hook.on-event-added.notify.summary = "New event in $calendar"
#gcal.hook.on-event-changed.cmd = "true"


# ---- Google People: a sync token poll over a contact group ---------------------

# The contact group this account watches, by name or resource name, `myContacts`
# holding every contact the account owns. Required.
#gpeople.addressbook = "myContacts"

#gpeople.auth.token.command = ["ortie", "token", "read", "google"]
#gpeople.watch.poll.interval = 60

# A contact leaving the group arrives as a removal, as a deleted one does.
#gpeople.hook.on-card-added.notify.summary = "New contact in $addressbook"
#gpeople.hook.on-card-removed.cmd = "true"
