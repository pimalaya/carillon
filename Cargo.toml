[package]
name = "carillon"
description = "CLI to watch PIM collection changes"
version = "0.2.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "email"]
keywords = ["cli", "watch", "imap", "jmap", "dav"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/carillon"

[features]
default = ["rustls-ring", "imap", "jmap", "maildir", "dav", "msgraph", "gmail", "gcal", "gpeople", "pimdir", "notify", "wizard"]
native-tls = ["pimalaya-stream/native-tls", "io-http?/native-tls", "io-pim-discovery?/native-tls", "io-imap?/native-tls", "io-jmap?/native-tls", "io-webdav?/native-tls", "io-msgraph?/native-tls", "io-gmail?/native-tls", "io-gcal?/native-tls", "io-gpeople?/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-http?/rustls-aws", "io-pim-discovery?/rustls-aws", "io-imap?/rustls-aws", "io-jmap?/rustls-aws", "io-webdav?/rustls-aws", "io-msgraph?/rustls-aws", "io-gmail?/rustls-aws", "io-gcal?/rustls-aws", "io-gpeople?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-http?/rustls-ring", "io-pim-discovery?/rustls-ring", "io-imap?/rustls-ring", "io-jmap?/rustls-ring", "io-webdav?/rustls-ring", "io-msgraph?/rustls-ring", "io-gmail?/rustls-ring", "io-gcal?/rustls-ring", "io-gpeople?/rustls-ring"]
imap = ["dep:io-imap", "io-imap/client"]
jmap = ["dep:base64", "dep:io-jmap", "io-jmap/client"]
maildir = ["dep:io-maildir", "io-maildir/client", "io-maildir/parser"]
dav = ["dep:ceichas", "dep:ical-rs", "dep:io-http", "dep:io-webdav", "dep:jiff", "io-webdav/client"]
msgraph = ["dep:io-msgraph", "io-msgraph/client"]
gmail = ["dep:io-gmail", "io-gmail/client"]
gcal = ["dep:io-gcal", "io-gcal/client"]
gpeople = ["dep:io-gpeople", "io-gpeople/client"]
notify = ["pimalaya-config/notify"]
pimdir = ["dep:ceichas", "dep:ical-rs", "dep:io-pimdir", "dep:jiff", "io-pimdir/client"]
vendored = ["pimalaya-stream/vendored", "io-http?/vendored", "io-pimdir?/vendored", "pimalaya-config/vendored"]
wizard = ["dep:io-pim-discovery", "pimalaya-cli/prompt", "pimalaya-cli/wizard", "pimalaya-cli/imap", "pimalaya-cli/jmap"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dev-dependencies]
io-oauth = { version = "0.5", default-features = false, features = ["jwt-bearer", "rustls-ring"] }
tempfile = "3"
toml = "1"

[build-dependencies]
pimalaya-cli = { version = "0.3", default-features = false, features = ["build"] }

[dependencies]
anyhow = "1"
base64 = { version = "0.23", optional = true }
ceichas = { version = "0.1", optional = true }
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
ctrlc = { version = "3", features = ["termination"] }
io-http = { version = "0.6", default-features = false, optional = true }
io-gcal = { version = "0.3", default-features = false, optional = true }
io-gmail = { version = "0.6", default-features = false, optional = true }
io-gpeople = { version = "0.6", default-features = false, optional = true }
ical-rs = { version = "0.7", default-features = false, features = ["parser", "tzdb"], optional = true }
io-imap = { version = "0.8", default-features = false, optional = true }
io-jmap = { version = "0.7", default-features = false, optional = true }
io-maildir = { version = "0.3", default-features = false, optional = true }
io-msgraph = { version = "0.7", default-features = false, optional = true }
io-pimdir = { version = "0.9", default-features = false, optional = true }
io-pim-discovery = { version = "0.11", default-features = false, features = ["autoconfig", "pacc", "rfc6186", "rfc6764", "rfc8620", "stream"], optional = true }
io-sasl = { version = "0.1", default-features = false, features = ["scram"] }
io-webdav = { version = "0.7", default-features = false, optional = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"], optional = true }
log = "0.4"
pimalaya-cli = { version = "0.3", default-features = false, features = ["terminal", "spinner"] }
pimalaya-config = { version = "0.3", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.3", default-features = false, features = ["std"] }
schemars = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3.1"
url = { version = "2.2", features = ["serde"] }

[patch.crates-io]
ceichas = { git = "https://github.com/pimalaya/ceichas", rev = "661be05e8dba827ee9c9ce80825bdaee7fe51ce4" }
pimalaya-config = { git = "https://github.com/pimalaya/config", rev = "09f5060339cc1e98d9c8b304b7ce41c87cf57f22" }
